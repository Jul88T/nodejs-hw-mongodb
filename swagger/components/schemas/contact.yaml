type: object
properties:
  _id:
    type: string
    example: '64fc70a50bd51c6b53992e97'
  name:
    type: string
    example: 'John Doe'
  phoneNumber:
    type: string
    example: '+123456789'
  email:
    type: string
    example: 'johndoe@example.com'
  isFavourite:
    type: boolean
    example: false
  contactType:
    type: string
    enum:
      - work
      - home
      - personal
    example: personal
  userId:
    type: string
    example: '64fc70a50bd51c6b53992e12'
  photo:
    type: string
    format: binary
  createdAt:
    type: string
    format: date-time
    example: '2025-07-15T09:34:00.000Z'
  updatedAt:
    type: string
    format: date-time
    example: '2025-07-15T10:12:00.000Z'
required:
  - name
  - phoneNumber
  - contactType
  - userId
