tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Create a contact with optional photo
security:
  - bearerAuth: []

requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - email
          - phone
        properties:
          name:
            type: string
            example: John Doe
          email:
            type: string
            format: email
            example: johndoe@example.com
          phone:
            type: string
            example: '+123456789'
          favorite:
            type: boolean
            example: false
          contactType:
            type: string
            example: work
          photo:
            type: string
            format: binary
            description: Upload contact photo

responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Contact created successfully
            data:
              $ref: '../../components/schemas/contact.yaml'
  '400':
    description: Invalid request body
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/error.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
