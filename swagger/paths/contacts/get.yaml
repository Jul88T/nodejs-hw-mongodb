tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Get paginated, filtered, and sorted contact list
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      default: 1
    description: Номер сторінки (pagination)

  - name: perPage
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      default: 10
    description: Кількість контактів на сторінку

  - name: sortBy
    in: query
    required: false
    schema:
      type: string
      enum: [name, email, phone, contactType, createdAt]
    description: Поле для сортування

  - name: sortOrder
    in: query
    required: false
    schema:
      type: string
      enum: [asc, desc]
      default: asc
    description: Напрям сортування (asc або desc)

  - name: type
    in: query
    required: false
    schema:
      type: string
    description: Тип контакту

  - name: isFavourite
    in: query
    required: false
    schema:
      type: boolean
    description: Фільтр за обраністю контакту

responses:
  '200':
    description: Список контактів з мета-інформацією про пагінацію
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 35
                totalPages:
                  type: integer
                  example: 4
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: true
  '401':
    $ref: '../../components/responses/401.yaml'
  '404':
    description: Not found
